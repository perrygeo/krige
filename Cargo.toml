[package]
name = "rust-interpolate"
version = "0.1.0"
edition = "2021"
authors = ["Matthew Perry"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# GDAL 3.13 support lives on georust/gdal master (unreleased); pin the commit
# so the build stays reproducible and matches the pinned nixpkgs GDAL 3.13.3.
gdal = { git = "https://github.com/georust/gdal", rev = "c0a6266b987a2c2d44aea9956c2cae1ed71445cf" }
rand = { version = "0.10.3" }
itertools = { version = "0.15.0" }
nalgebra = { version = "0.35.0" }
kdtree = { version = "0.8.1" }
plotlib = "0.5.1"
rayon = "1.5"
